<!DOCTYPE html>
<html>
    <head>
        <style>
            @keyframes myFadingAnimation {
                0% {
                    opacity: 0;
                }
                100% {
                    opacity: 1;
                }
            }
            .header {
                animation-name: myFadingAnimation;
                animation-duration: 8s;
            }
            .para {
                animation-name: myFadingAnimation;
                animation-duration: 4s;
            }
            
        </style>
        <title>Learning CSS Animations</title>
    </head>
    <body>
        <h1 class="header">KodNest</h1>

        <p class="para">This is paragraph</p>
    </body>
</html>
