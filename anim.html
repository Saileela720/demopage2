<!DOCTYPE html>
<html>
    <head>
        <style>
            .box{
                width: 100px;
                height: 100px;
                background-color: blue;
                transition: transform 0.8s ease;
                transform-origin: top left;
            }
            .box:hover{
                transform: rotate(45deg);
            }
        </style>
        <title>Learning transformation</title>
    </head>
    <body>
        <div class="box"></div>
    </body>
</html>
